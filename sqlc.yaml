version: "2"
sql:
  - engine: "postgresql"
    schema: "pkg/identity/sqlstore/schema.sql"
    queries: "pkg/identity/sqlstore/queries.sql"
    gen:
      go:
        package: "identitydb"
        out: "pkg/identity/sqlc"
        sql_package: "database/sql"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
        emit_exact_table_names: true
